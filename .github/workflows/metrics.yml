name: Metrics
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚀 Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: general.svg
          committer_message: "chore: update metrics [skip ci]"
          
          # Базовые настройки (упрощенные)
          template: classic
          base: header, activity, community, repositories
          
          # 🌟 ПЛАГИНЫ (по одному, чтобы избежать ошибок)
          
          # Календарь
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Языки (УПРОЩЕННАЯ ВЕРСИЯ без глубокого анализа)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300
          # ОТКЛЮЧАЕМ проблемные опции:
          plugin_languages_indepth: no
          plugin_lines: no
          
          # Привычки
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Достижения
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          
          # Активность
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          
          # Репозитории
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          # Звезды
          plugin_stargazers: yes
          plugin_stargazers_days: 14
          plugin_stargazers_charts: yes
          
          # Люди
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          
          # Музыка (опционально)
          plugin_music: no
          
          # PageSpeed
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://github.com/ll1ness
          
          # Настройки времени
          config_timezone: Europe/Moscow
          config_twemoji: yes
          config_octicon: yes
          config_animations: yes
