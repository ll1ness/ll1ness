name: Metrics
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ИЗОБРАЖЕНИЕ 1: Активность и языки
      - name: 📊 Generate image 1 - Activity & Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          base: header, repositories
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_activity: no
          plugin_achievements: no
          plugin_people: no
          plugin_followup: no
          config_timezone: Europe/Moscow
          
      # ИЗОБРАЖЕНИЕ 2: Репозитории и сообщество
      - name: 👥 Generate image 2 - Repositories & Community
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-community.svg
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_people: yes
          plugin_people_limit: 24
          plugin_stargazers: yes
          plugin_activity: no
          plugin_achievements: no
          plugin_isocalendar: no
          plugin_languages: no
          plugin_habits: no
          config_timezone: Europe/Moscow
